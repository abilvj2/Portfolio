name: Build and deploy to GitHub Pages

# Everything runs on GitHub's runners — nothing needs to be installed locally.
on:
  push:
    branches:
      - main
      - claude/portfolio-website-react-ui-ylz69i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No configure-pages step: the base path is hardcoded in vite.config.ts,
      # and that action's `enablement` flag cannot create a Pages site anyway —
      # the workflow token lacks the admin scope the create-Pages API needs.
      # Enable Pages once under Settings > Pages > Source: GitHub Actions.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # The github-pages environment only accepts deployments from the default
    # branch. Skipping here keeps runs on other branches green instead of
    # failing them at the environment gate.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
